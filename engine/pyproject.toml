[project]
name = "openfrontdesk"
version = "0.1.0"
description = "Open-source AI front desk for appointment-based businesses, with guardrails on irreversible actions."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "openai>=1.60",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tzdata>=2024.2",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openfrontdesk"]
