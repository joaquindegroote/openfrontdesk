id: the-time-she-was-offered-is-gone
title: Comes back to take a time she was offered, and someone else has booked it
now: 2026-11-02T08:00:00-03:00 # Monday, before opening
max_turns: 8
# She says she'll check with work, and comes back at lunch. By then every check-up starting
# between 9:00 and 10:00 on Wednesday has been booked by someone else.
sent_at:
  3: 2026-11-02T12:30:00-03:00
taken_before:
  3:
    service: checkup
    starting_from: 2026-11-04T09:00:00-03:00
    until: 2026-11-04T10:00:00-03:00
customer:
  name: Camila Rojas
  phone: "+56950100103"
  goal: >-
    Book a check-up on Wednesday November 4 in the morning. In your first message, say you
    want a check-up and ask which Wednesday morning times are open. When you're told the times,
    say you need to check with work and will come back, and stop there. In your next message,
    you're back: ask to book the earliest time you were offered, naming it ("the 9:00 AM with
    Dr. Fuentes"). If it can't be booked, take the earliest other Wednesday morning time you're
    given, and say yes when asked to confirm.
expect:
  ends: customer_done
  must_call: [find_available_slots, book_appointment]
  appointments:
    - patient: Camila Rojas
      service: checkup
      status: confirmed
      day: 2026-11-04
      starts_after: "10:00"
      starts_before: "12:00"
    - patient: Camila Rojas
      service: checkup
      status: confirmed
      safety: more
  rubric:
    - When the time she asked for can't be booked, says it was taken or is no longer available.
    - Never tells her that the time she was offered was never open, may never have been open, or
      was offered by mistake.
