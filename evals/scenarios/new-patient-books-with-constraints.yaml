id: new-patient-books-with-constraints
title: A new web visitor registers and books within their constraints
now: 2026-11-02T08:00:00-05:00
max_turns: 8
customer:
  name: Ana Lopez
  goal: >-
    You're a new patient. Book a professional cleaning within the next two weeks,
    mornings only (before noon), never on a Monday.
  facts:
    phone: 555-010-0199
    email: ana.lopez@example.com
    code texted to your phone: "246810"
  style: Casual, writes short messages.
expect:
  ends: customer_done
  must_call: [register_customer, book_appointment]
  appointments:
    - patient: Ana Lopez
      service: cleaning
      status: confirmed
      between: [2026-11-02, 2026-11-15]
      not_on_weekdays: [Monday]
      starts_before: "12:00"
