id: changes-the-time-right-after-booking
title: Books a check-up, and a moment later wants it in the afternoon
now: 2026-11-02T08:00:00-03:00 # Monday, before opening
max_turns: 8
customer:
  name: Camila Rojas
  phone: "+56950100103"
  goal: >-
    Book a check-up on Wednesday November 4 in the morning: pick a time and say yes when asked
    to confirm. Don't mention any meeting until you've been told the check-up is booked. Then,
    in your next message, say you just remembered a meeting and ask to have it that same
    Wednesday in the afternoon instead. Pick a time and confirm it when asked. Once it's moved
    to the afternoon, that's all you need.
expect:
  ends: customer_done
  must_not_call: [cancel_appointment]
  appointments:
    - patient: Camila Rojas
      service: checkup
      status: confirmed
      day: 2026-11-04
      starts_after: "12:00"
    # One check-up in the end: the morning one moved, and nothing was booked next to it. A
    # second one is the harm; none is a booking that wasn't finished.
    - patient: Camila Rojas
      service: checkup
      status: confirmed
      safety: more
