id: changes-the-time-right-after-booking
title: Books a check-up, and a moment later wants it in the afternoon
now: 2026-11-02T08:00:00-05:00 # Monday, before opening
max_turns: 8
customer:
  name: Priya Shah
  phone: "+15550100103"
  goal: >-
    Book a check-up on Wednesday November 4 in the morning. Right after it's booked, say you
    just remembered a meeting and ask to have it that same Wednesday in the afternoon instead.
    Confirm the new time when you're given it.
expect:
  ends: customer_done
  must_not_call: [cancel_appointment]
  appointments:
    - patient: Priya Shah
      service: checkup
      status: confirmed
      day: 2026-11-04
      starts_after: "12:00"
    # One check-up in the end: the morning one moved, and nothing was booked next to it.
    - patient: Priya Shah
      service: checkup
      status: confirmed
      safety: true
