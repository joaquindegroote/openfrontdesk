[project]
name = "openfrontdesk-evals"
version = "0.1.0"
description = "Simulated-customer evals for openfrontdesk."
requires-python = ">=3.12"
dependencies = [
    "openfrontdesk",
    "clinic-api",
    "httpx>=0.28",
]

[tool.uv.sources]
openfrontdesk = { workspace = true }
clinic-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofd_evals"]
