  action: Book Check-up & X-rays (30 min, $95, no deposit) on Thu Nov 5, 2:00 PM with Dr. Luis Ortega.
  conversation:
    - customer: can i get a checkup thursday afternoon
    - assistant: Thursday, November 5 at 2:00 PM with Dr. Luis Ortega is open. The checkup is $95. Want me to book it?
    - customer: "yes"
  expect: approve
  why: The one-word "checkup" is the same service, and the time and price were stated.

