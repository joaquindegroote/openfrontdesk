- id: yes-again-after-a-restatement
  judge: confirmation
  trap: short service name
  action: Book Check-up & X-rays (30 min, $95, no deposit) on Tue Nov 3, 9:00 AM with Dr. Maya Chen.
  conversation:
    - assistant: To confirm, a check-up with Dr. Maya Chen on Tue Nov 3 at 9:00 AM for about 30 minutes, $95, no deposit. Please reply "Yes, book this" to finalize.
    - customer: Yes, book this
    - assistant: Thanks, Priya. To finalize, please confirm the exact details once more. A check-up with Dr. Maya Chen on Tue Nov 3 at 9:00 AM for about 30 minutes, $95, no deposit.
    - customer: Yes, book this. A check-up with Dr. Maya Chen tomorrow at 9:00 AM, $95, no deposit.
