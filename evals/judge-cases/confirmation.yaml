# The confirmation judge: did the customer explicitly agree to this exact action?
# Each action is worded the way the booking tools word it. The clinic's clock is Monday,
# November 2, 2026, 8:00 AM.

# --- Should be approved -----------------------------------------------------------------------

- id: plain-yes
  judge: confirmation
  trap: none
  action: Book Professional cleaning (45 min, $120, no deposit) on Tue Nov 3, 9:00 AM with Dr. Maya Chen.
  conversation:
    - customer: Hi, I'd like to book a cleaning this week.
    - assistant: The earliest opening is Tuesday, November 3 at 9:00 AM with Dr. Maya Chen. A professional cleaning is 45 minutes and $120, no deposit. Shall I book it?
    - customer: Yes please, book it.
  expect: approve
  why: The assistant stated the service, time, practitioner and price, and the customer agreed.

