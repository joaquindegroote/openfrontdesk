[project]
name = "clinic-api"
version = "0.1.0"
description = "Mock booking system for a fictional dental clinic. Stands in for the business backend the agent talks to."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "tzdata>=2024.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_api"]
