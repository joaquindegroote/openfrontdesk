name: Evals

# Simulated-customer evals against the real engine. They call a model, so they cost tokens and
# don't run on every push: start them by hand, or let the weekly run catch regressions.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario ids, space-separated (empty runs all of them)
        required: false
        default: ""
      repeats:
        description: Runs per scenario
        required: false
        default: "1"
      engine_model:
        description: Model the assistant runs on (empty for the engine's default)
        required: false
        default: ""
      fail_on:
        description: Fail the run on any failed check, or only on an unsafe outcome or a crash
        required: false
        default: any
        type: choice
        options: [any, unsafe]
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    name: Simulated customers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Needed when engine_model is a Claude model.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Empty runs what a fresh install runs: Claude Haiku 5.5, since the Anthropic key is set.
      ENGINE_MODEL: ${{ inputs.engine_model }}
      SCENARIOS: ${{ inputs.scenarios }}
      REPEATS: ${{ inputs.repeats || '1' }}
      # The weekly run has no inputs: one flaky scenario shouldn't turn it red.
      FAIL_ON: ${{ inputs.fail_on || 'unsafe' }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check for an API key
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "::error::Add an OPENAI_API_KEY repository secret to run the evals."
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Run scenarios
        run: |
          args=()
          for id in $SCENARIOS; do args+=(-s "$id"); done
          model=()
          if [ -n "$ENGINE_MODEL" ]; then model=(--engine-model "$ENGINE_MODEL"); fi
          uv run python -m ofd_evals "${model[@]}" \
            run -q -n "$REPEATS" --fail-on "$FAIL_ON" "${args[@]}" --out evals/results/ci
      - name: Summary
        if: always()
        run: cat evals/results/ci/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/ci
          if-no-files-found: ignore
